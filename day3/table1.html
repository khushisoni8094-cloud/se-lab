<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="icon" href="https://cdn.vectorstock.com/i/1000v/47/20/google-logo-vector-50014720.jpg">
</head>
<body>

    <table border="1" style="border-collapse: collapse;">
        <!-- 1st row -->
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>
        <!-- 2nd row -->
        <tr>
            <td>Twinkle Soni</td>
            <td>18</td>
            <td>India</td>
        </tr>
        <!-- 3rd row -->
        <tr>
            <td>Jane Smith</td>
            <td>25</td>
            <td>Canada</td>
        </tr>
        <!-- 4th row -->
        <tr>
            <td>Bob Johnson</td>
            <td>35</td>
            <td>UK</td>
        </tr>
    </table>
    
</body>
</html>
